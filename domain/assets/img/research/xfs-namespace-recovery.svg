<text x="490" y="70" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#46546b">Raw (parent inode, filename bytes, child inode) tuples</text>
<line x1="100" y1="455" x2="925" y2="455" stroke="#334155" stroke-width="2"/><line x1="100" y1="100" x2="100" y2="455" stroke="#334155" stroke-width="2"/>

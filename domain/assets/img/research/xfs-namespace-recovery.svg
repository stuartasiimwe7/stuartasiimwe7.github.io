 <rect x="130" y="145" width="130" height="310" fill="#2563eb"/><text x="195" y="133" fill="#172033" font-weight="700">87,298</text><text x="195" y="485" fill="#172033">VRFS edges</text>
 <rect x="300" y="130" width="130" height="325" fill="#0f766e"/><text x="365" y="118" fill="#172033" font-weight="700">91,559</text><text x="365" y="485" fill="#172033">Native edges</text>
 <rect x="470" y="146" width="130" height="309" fill="#16a34a"/><text x="535" y="134" fill="#172033" font-weight="700">86,985</text><text x="535" y="485" fill="#172033">Exact matches</text>
